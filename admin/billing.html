<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Billing | PranVeda Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="admin-layout">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

<h2>🌿 PranVeda</h2>

<span>Admin Panel</span>

</div>

<ul class="menu">

<li>
<a href="dashboard.html">
<i class="fas fa-chart-line"></i>
<span>Dashboard</span>
</a>
</li>

<li class="active">
<a href="billing.html">
<i class="fas fa-file-invoice"></i>
<span>Billing</span>
</a>
</li>

<li>
<a href="orders.html">
<i class="fas fa-box"></i>
<span>Orders</span>
</a>
</li>

<li>
<a href="customers.html">
<i class="fas fa-users"></i>
<span>Customers</span>
</a>
</li>

<li>
<a href="login.html">
<i class="fas fa-right-from-bracket"></i>
<span>Logout</span>
</a>
</li>

</ul>

</aside>

<!-- Main -->

<main class="main-content">

<header class="topbar">

<div>

<h1>Create Invoice</h1>

<p>Manual Billing System</p>

</div>

<div class="admin-user">

<i class="fas fa-user-circle"></i>

Admin

</div>

</header>

<!-- Invoice Information -->

<div class="billing-card">

<h2>Invoice Details</h2>

<div class="billing-grid">

<div>

<label>Invoice No</label>

<input
type="text"
id="invoiceNo"
readonly>

</div>

<div>

<label>Date</label>

<input
type="date"
id="invoiceDate">

</div>

</div>

</div>

<!-- Customer -->

<div class="billing-card">

<h2>Customer Details</h2>

<div class="billing-grid">

<div>

<label>Customer Name</label>

<input
type="text"
id="customerName"
placeholder="Customer Name">

</div>

<div>

<label>Mobile</label>

<input
type="text"
id="customerPhone"
placeholder="9876543210">

</div>

<div class="full">

<label>Address</label>

<textarea
id="customerAddress"
rows="3"></textarea>

</div>

</div>

</div>

<!-- Product -->

<div class="billing-card">

<h2>Add Product</h2>

<div class="billing-grid">

<div>

<label>Product</label>

<select id="product">

<option>Select Product</option>

<option>Brahmi Hair Oil</option>

<option>Kumkumadi Cream</option>

<option>Ashwagandha Powder</option>

<option>Immunity Tonic</option>

</select>

</div>

<div>

<label>Quantity</label>

<input
type="number"
id="qty"
value="1">

</div>

<div>

<label>Price</label>

<input
type="number"
id="price">

</div>

<div>

<button
class="action-btn"
id="addProduct">

<i class="fas fa-plus"></i>

Add Product

</button>

</div>

</div>

</div>

<!-- Product Table -->

<div class="billing-card">

<h2>Invoice Items</h2>

<table id="invoiceTable">

<thead>

<tr>

<th>Product</th>

<th>Qty</th>

<th>Price</th>

<th>Total</th>

<th>Action</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<!-- Total -->

<div class="billing-card">

<h2>Invoice Summary</h2>

<div class="summary">

<p>Subtotal <span id="subtotal">₹0</span></p>

<p>Discount <span id="discount">₹0</span></p>

<p>GST <span id="gst">₹0</span></p>

<h2>Grand Total <span id="grandTotal">₹0</span></h2>

</div>

<div class="button-group">

<button id="saveBill" class="action-btn">

Save

</button>

<button id="printBill" class="action-btn" disabled>

Print

</button>

<button id="pdfBill" class="action-btn" disabled>

PDF

</button>

<button id="whatsappBill" class="action-btn" disabled>

WhatsApp

</button>

<button id="newBill" class="action-btn" disabled>

New Bill

</button>

</div>

</div>

</main>

</div>

<script src="js/admin.js"></script>

</body>

</html>
