<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PranVeda Admin Login</title>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="login-wrapper">

        <!-- LEFT PANEL -->

        <div class="left-panel">

            <img src="assets/images/logo.png" alt="PranVeda">

            <h1>

                PranVeda ERP

            </h1>

            <p>

                Welcome to the PranVeda Administration Portal.

                Manage Products, Billing, Customers,
                Orders and Reports from one secure place.

            </p>

        </div>

        <!-- RIGHT PANEL -->

        <div class="right-panel">

            <div class="login-box">

                <h2 class="login-title">

                    Administrator Login

                </h2>

                <p class="login-subtitle">

                    Sign in to continue

                </p>

                <!-- Login Form -->

                <form id="loginForm">

                    <!-- Username -->

                    <div class="form-group">

                        <label>Email Address</label>

                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>

                            <input type="email" id="email" class="form-control" placeholder="Enter Email Address"
                                required>

                        </div>

                    </div>

                    <!-- Password -->

                    <div class="form-group">

                        <label>Password</label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input type="password" id="password" class="form-control" placeholder="Enter Password"
                                required>

                            <i class="fa-solid fa-eye toggle-password" id="togglePassword">
                            </i>

                        </div>

                    </div>

                    <!-- Remember -->

                    <div class="login-options">

                        <label class="remember">

                            <input type="checkbox" id="remember">

                            <span>Remember Me</span>

                        </label>

                        <a href="#" class="forgot">

                            Forgot Password?

                        </a>

                    </div>

                    <!-- Button -->

                    <button type="submit" class="login-btn">

                        <i class="fa-solid fa-right-to-bracket"></i>

                        Login

                    </button>

                </form>

                <!-- Footer -->

                <div class="login-footer">

                    <p>

                        © 2026

                        <strong>PranVeda ERP</strong>

                        All Rights Reserved.

                    </p>

                </div>

            </div>

        </div>

    </div>
    <script src="js/login.js"></script>

</body>

</html>
